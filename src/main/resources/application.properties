# === MySQL Verbindung ===
spring.datasource.url=jdbc:mysql://localhost:3307/kunden_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# === JPA / Hibernate ===
# Dev: update; Prod: validate/Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# === Server ===
server.port=8090

