# === MySQL Verbindung ===
spring.datasource.url=jdbc:mysql://localhost:3306/kunden_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci
spring.datasource.username=app
spring.datasource.password=app

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update   # Dev: update; Prod: validate/Flyway
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# === Server ===
server.port=8080

